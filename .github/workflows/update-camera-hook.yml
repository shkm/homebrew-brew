name: Update camera-hook formula

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for new release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! LATEST=$(gh api repos/shkm/camera-hook/releases/latest --jq '.tag_name' 2>/dev/null); then
            echo "No releases found"
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "No releases found"
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${LATEST#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest release: $VERSION"

          if [ -f camera-hook.rb ]; then
            CURRENT=$(grep 'version "' camera-hook.rb | head -1 | sed 's/.*version "//;s/".*//')
            echo "Current formula version: $CURRENT"
            if [ "$VERSION" = "$CURRENT" ]; then
              echo "Already up to date"
              echo "has_update=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "has_update=true" >> "$GITHUB_OUTPUT"

      - name: Download and hash binary
        if: steps.check.outputs.has_update == 'true'
        id: hash
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          echo "Downloading camera-hook binary..."
          curl -fsSL "https://github.com/shkm/camera-hook/releases/download/v${VERSION}/camera-hook" -o camera-hook-bin
          SHA=$(shasum -a 256 camera-hook-bin | cut -d' ' -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA"

      - name: Update formula
        if: steps.check.outputs.has_update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          SHA: ${{ steps.hash.outputs.sha }}
        run: |
          cat > camera-hook.rb << EOF
          class CameraHook < Formula
            desc "Run scripts when your Mac camera turns on or off"
            homepage "https://github.com/shkm/camera-hook"
            url "https://github.com/shkm/camera-hook/releases/download/v${VERSION}/camera-hook"
            sha256 "${SHA}"
            version "${VERSION}"
            license "MIT"

            depends_on macos: ">= :sonoma"

            def install
              bin.install "camera-hook"
            end

            service do
              run [opt_bin/"camera-hook", "watch"]
              keep_alive true
              log_path var/"log/camera-hook.log"
              error_log_path var/"log/camera-hook.log"
            end

            test do
              system bin/"camera-hook", "--version"
            end
          end
          EOF

          # Remove leading whitespace from heredoc
          sed -i '' 's/^          //' camera-hook.rb

      - name: Commit and push
        if: steps.check.outputs.has_update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add camera-hook.rb
          git commit -m "Update camera-hook to v${VERSION}"
          git push
