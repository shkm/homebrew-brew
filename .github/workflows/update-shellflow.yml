name: Update shellflow cask

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for new release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! LATEST=$(gh api repos/shkm/shellflow/releases/latest --jq '.tag_name' 2>/dev/null); then
            echo "No releases found"
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "No releases found"
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${LATEST#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest release: $VERSION"

          if [ -f Casks/shellflow.rb ]; then
            CURRENT=$(grep 'version "' Casks/shellflow.rb | head -1 | sed 's/.*version "//;s/".*//')
            echo "Current cask version: $CURRENT"
            if [ "$VERSION" = "$CURRENT" ]; then
              echo "Already up to date"
              echo "has_update=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "has_update=true" >> "$GITHUB_OUTPUT"

      - name: Download and hash DMGs
        if: steps.check.outputs.has_update == 'true'
        id: hash
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          BASE_URL="https://github.com/shkm/shellflow/releases/download/v${VERSION}"

          echo "Downloading ARM DMG..."
          curl -fsSL "${BASE_URL}/Shellflow_${VERSION}_aarch64.dmg" -o arm.dmg
          SHA_ARM=$(shasum -a 256 arm.dmg | cut -d' ' -f1)
          echo "sha_arm=$SHA_ARM" >> "$GITHUB_OUTPUT"
          echo "ARM SHA256: $SHA_ARM"

          echo "Downloading Intel DMG..."
          curl -fsSL "${BASE_URL}/Shellflow_${VERSION}_x64.dmg" -o intel.dmg
          SHA_INTEL=$(shasum -a 256 intel.dmg | cut -d' ' -f1)
          echo "sha_intel=$SHA_INTEL" >> "$GITHUB_OUTPUT"
          echo "Intel SHA256: $SHA_INTEL"

      - name: Update cask
        if: steps.check.outputs.has_update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          SHA_ARM: ${{ steps.hash.outputs.sha_arm }}
          SHA_INTEL: ${{ steps.hash.outputs.sha_intel }}
        run: |
          mkdir -p Casks

          cat > Casks/shellflow.rb << EOF
          cask "shellflow" do
            version "${VERSION}"

            on_arm do
              sha256 "${SHA_ARM}"
              url "https://github.com/shkm/shellflow/releases/download/v#{version}/Shellflow_#{version}_aarch64.dmg"
            end

            on_intel do
              sha256 "${SHA_INTEL}"
              url "https://github.com/shkm/shellflow/releases/download/v#{version}/Shellflow_#{version}_x64.dmg"
            end

            name "Shellflow"
            desc "Desktop app for orchestrating git worktrees with integrated terminal support"
            homepage "https://github.com/shkm/shellflow"

            depends_on macos: ">= :ventura"

            app "Shellflow.app"

            zap trash: [
              "~/.config/shellflow",
            ]
          end
          EOF

          # Remove leading whitespace from heredoc
          sed -i '' 's/^          //' Casks/shellflow.rb

      - name: Commit and push
        if: steps.check.outputs.has_update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/shellflow.rb
          git commit -m "Update shellflow to v${VERSION}"
          git push
